name: DC 자비스 구성종목 테스트

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test-holdings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 구성종목 테스트 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python test_etf_holdings.py
      - name: 결과 커밋
        run: |
          git config user.name "dc-jarvis-bot"
          git config user.email "actions@github.com"
          git add data/test_etf_holdings.json
          git diff --cached --quiet || git commit -m "구성종목 테스트 결과 갱신"
          git pull --rebase
          git push
