name: DC 자비스 포트폴리오 분석

on:
  schedule:
    - cron: "0 1,5,7 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze-portfolio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 포트폴리오 분석 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python portfolio_analysis.py
      - name: 결과 커밋
        run: |
          git config user.name "dc-jarvis-bot"
          git config user.email "actions@github.com"
          git add data/portfolio_snapshot.json data/portfolio_history.json
          git diff --cached --quiet || git commit -m "포트폴리오 평가 자동 갱신"
          git pull --no-rebase -X ours
          git push
