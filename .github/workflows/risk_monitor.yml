name: DC 자비스 강화 모니터링

on:
  schedule:
    - cron: "0,15,30,45 0-6 * * 1-5"   # 평일 KST 09:00~06:45(UTC), 15분 간격 (장중 전체 커버)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 강화 모니터링 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: python risk_monitor.py
      - name: 결과 커밋
        run: |
          git config user.name "dc-jarvis-bot"
          git config user.email "actions@github.com"
          git add data/risk_alerts.json data/notification_state.json
          git diff --cached --quiet || git commit -m "리스크 알림 자동 갱신"
          git pull --no-rebase -X ours
          git push
