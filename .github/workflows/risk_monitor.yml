name: DC 자비스 강화 모니터링

on:
  schedule:
    - cron: "0 1-6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: 강화 모니터링 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python risk_monitor.py
      - name: 결과 커밋
        run: |
          git config user.name "dc-jarvis-bot"
          git config user.email "actions@github.com"
          git add data/risk_alerts.json
          git diff --cached --quiet || git commit -m "리스크 알림 자동 갱신"
          git pull --rebase
          git push
