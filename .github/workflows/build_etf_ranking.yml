name: DC 자비스 ETF 랭킹 수집

on:
  schedule:
    - cron: "40 6 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-ranking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: ETF 랭킹 수집 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: python build_etf_ranking.py
      - name: 결과 커밋
        run: |
          git config user.name "dc-jarvis-bot"
          git config user.email "actions@github.com"
          git add data/etf_ranking.json data/etf_top30.json
          git diff --cached --quiet || git commit -m "ETF 랭킹 자동 갱신"
          git pull --rebase
          git push
