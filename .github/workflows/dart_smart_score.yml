name: DC 자비스 DART 스마트발굴

on:
  schedule:
    - cron: "0 8 * * 1-5"   # 평일 한국시간 17:00
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  smart-score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: DART 스마트발굴 실행
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python dart_smart_score.py
      - name: 결과 커밋
        run: |
          git config user.name "dc-jarvis-bot"
          git config user.email "actions@github.com"
          git add data/dart_smart_scores.json
          git diff --cached --quiet || git commit -m "DART 스마트발굴 결과 자동 갱신"
          git pull --no-rebase -X ours
          git push
