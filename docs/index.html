<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DC 자비스</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<style>
  :root {
    --blue: #2563eb;
    --red: #dc2626;
    --green-bg: #ecfdf5;
    --gray-bg: #f8fafc;
    --border: #e2e8f0;
    --text: #1e293b;
    --text-sub: #64748b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Malgun Gothic", sans-serif;
    margin: 0;
    background: var(--gray-bg);
    color: var(--text);
    padding-bottom: 40px;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: white;
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { font-size: 17px; margin: 0; display: flex; align-items: center; gap: 6px; }
  .icon-btn {
    border: none; background: var(--gray-bg); border-radius: 10px;
    width: 38px; height: 38px; font-size: 16px; cursor: pointer;
  }
  main { padding: 14px; max-width: 480px; margin: 0 auto; }
  .card {
    background: white; border-radius: 14px; padding: 16px;
    margin-bottom: 12px; border: 1px solid var(--border);
  }
  .card-title {
    font-size: 13px; color: var(--text-sub); margin: 0 0 10px 0;
    display: flex; justify-content: space-between; align-items: center;
  }
  .risk-score { display: flex; align-items: baseline; gap: 8px; }
  .risk-score .num { font-size: 36px; font-weight: 700; }
  .badge {
    display: inline-block; padding: 3px 10px; border-radius: 999px;
    font-size: 12px; font-weight: 600;
  }
  .badge.안정 { background: #dcfce7; color: #16a34a; }
  .badge.주의 { background: #fef9c3; color: #ca8a04; }
  .badge.경고 { background: #fee2e2; color: #dc2626; }
  .badge.위험 { background: #fee2e2; color: #991b1b; }
  .badge.매수후보 { background: #dbeafe; color: #1d4ed8; }
  .badge.관심종목 { background: #e0e7ff; color: #4338ca; }
  .badge.관망 { background: #f1f5f9; color: #64748b; }
  .badge.제외권장 { background: #f1f5f9; color: #94a3b8; }
  .badge.긴급 { background: #fee2e2; color: #991b1b; }
  .badge.경고lv { background: #ffedd5; color: #c2410c; }
  .badge.정보 { background: #f1f5f9; color: #64748b; }
  .item-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 0; border-top: 1px solid var(--border);
  }
  .item-row:first-child { border-top: none; }
  .item-name { font-size: 14px; font-weight: 600; }
  .item-reason { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .pnl-pos { color: var(--red); font-weight: 700; }
  .pnl-neg { color: var(--blue); font-weight: 700; }
  .empty { color: var(--text-sub); font-size: 13px; text-align: center; padding: 20px 0; }
  .freshness { font-size: 11px; color: var(--text-sub); text-align: center; margin-top: 4px; }
  .freshness.stale { color: var(--red); }
  #subscribeOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  #subscribeOverlay .box {
    background: white; border-radius: 16px; padding: 24px; max-width: 360px; width: 100%;
    text-align: center;
  }
  #subscribeOverlay button {
    font-size: 15px; padding: 12px 24px; border-radius: 10px; border: none;
    background: var(--blue); color: white; margin-top: 14px; width: 100%;
  }
  #subscribeOverlay .close { background: none; color: var(--text-sub); margin-top: 8px; }
  #subJson { width: 100%; height: 120px; margin-top: 10px; font-size: 10px; font-family: monospace; }
  .loading { text-align: center; color: var(--text-sub); padding: 30px 0; font-size: 13px; }

  #chatFab {
    position: fixed; right: 18px; bottom: 18px; z-index: 50;
    width: 54px; height: 54px; border-radius: 50%; border: none;
    background: var(--blue); color: white; font-size: 22px;
    box-shadow: 0 4px 12px rgba(37,99,235,0.4); cursor: pointer;
  }
  #chatOverlay {
    display: none; position: fixed; inset: 0; background: white; z-index: 200;
    flex-direction: column;
  }
  #chatOverlay.open { display: flex; }
  #chatHeader {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: white; position: sticky; top: 0;
  }
  #chatHeader h2 { font-size: 15px; margin: 0; }
  #chatMessages { flex: 1; overflow-y: auto; padding: 14px; }
  .msg-row { display: flex; margin-bottom: 10px; }
  .msg-row.user { justify-content: flex-end; }
  .msg-bubble {
    max-width: 78%; padding: 10px 14px; border-radius: 16px; font-size: 14px; line-height: 1.5;
    white-space: pre-wrap;
  }
  .msg-row.user .msg-bubble { background: var(--blue); color: white; border-bottom-right-radius: 4px; }
  .msg-row.bot .msg-bubble { background: var(--gray-bg); color: var(--text); border-bottom-left-radius: 4px; }
  .msg-row.bot .msg-bubble.error { background: #fee2e2; color: #991b1b; }
  #chatInputBar {
    display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border);
    background: white; position: sticky; bottom: 0;
  }
  #chatInput {
    flex: 1; border: 1px solid var(--border); border-radius: 20px; padding: 10px 16px;
    font-size: 14px; resize: none; font-family: inherit;
  }
  #chatSendBtn {
    border: none; background: var(--blue); color: white; border-radius: 50%;
    width: 42px; height: 42px; font-size: 16px; cursor: pointer; flex-shrink: 0;
  }
  #chatSendBtn:disabled { background: #93c5fd; }
  .chat-suggestions { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 14px 10px; }
  .chip {
    border: 1px solid var(--border); background: white; border-radius: 999px;
    padding: 6px 12px; font-size: 12px; color: var(--text-sub); cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>📈 DC 자비스</h1>
  <button class="icon-btn" id="bellBtn" title="알림 설정">🔔</button>
</header>

<main id="main">
  <div class="loading">데이터 불러오는 중...</div>
</main>

<div id="subscribeOverlay">
  <div class="box">
    <h3 style="margin-top:0">🔔 알림 구독</h3>
    <p style="font-size:13px;color:var(--text-sub)">위험경보 / 매수후보 발견 시 이 기기로 알림을 받습니다.</p>
    <button id="subscribeBtn">알림 구독하기</button>
    <textarea id="subJson" style="display:none" readonly></textarea>
    <div id="subStatus" style="font-size:12px;color:var(--text-sub);margin-top:8px;"></div>
    <button class="close" id="closeOverlay">닫기</button>
  </div>
</div>

<button id="chatFab" title="DC 자비스에게 물어보기">💬</button>

<div id="chatOverlay">
  <div id="chatHeader">
    <h2>💬 DC 자비스에게 물어보기</h2>
    <button class="icon-btn" id="closeChatBtn">✕</button>
  </div>
  <div id="chatMessages">
    <div class="msg-row bot">
      <div class="msg-bubble">안녕하세요! 오늘 위험도, 매수후보, 보유종목 손익 등 저장된 데이터 기준으로 답변해드려요. 무엇이 궁금하신가요?</div>
    </div>
  </div>
  <div class="chat-suggestions">
    <button class="chip" data-q="오늘 매수후보 뭐야?">오늘 매수후보?</button>
    <button class="chip" data-q="지금 시장 위험도 어때?">시장 위험도?</button>
    <button class="chip" data-q="내 보유종목 손익 알려줘">보유종목 손익?</button>
  </div>
  <div id="chatInputBar">
    <textarea id="chatInput" rows="1" placeholder="메시지를 입력하세요..."></textarea>
    <button id="chatSendBtn">➤</button>
  </div>
</div>

<script>
const REPO_RAW = "https://raw.githubusercontent.com/kkandelo-arch/jarvis/main/data/";
const VAPID_PUBLIC_KEY = "BG32wpG4vuVXwbPcCm9G9z23SdNYIQzJZMRxQWnpfDxYAZRTKb0-CNIJUxaRnMssn94aOO0nXG289OUcE2czKss";

async function fetchJson(name) {
  try {
    const res = await fetch(REPO_RAW + name + "?t=" + Date.now());
    if (!res.ok) return null;
    return await res.json();
  } catch (e) {
    return null;
  }
}

function fmtNum(n) {
  return n.toLocaleString("ko-KR");
}

function pnlClass(pct) {
  return pct >= 0 ? "pnl-pos" : "pnl-neg";
}

function pnlSign(pct) {
  return (pct >= 0 ? "+" : "") + pct + "%";
}

function timeAgo(iso) {
  if (!iso) return "";
  const diffMin = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (diffMin < 60) return `${diffMin}분 전`;
  const diffHr = Math.round(diffMin / 60);
  if (diffHr < 24) return `${diffHr}시간 전`;
  return `${Math.round(diffHr / 24)}일 전`;
}

async function loadDashboard() {
  const [risk, discovery, portfolio, alerts, health] = await Promise.all([
    fetchJson("risk_score.json"),
    fetchJson("etf_discovery.json"),
    fetchJson("portfolio_snapshot.json"),
    fetchJson("risk_alerts.json"),
    fetchJson("system_health.json"),
  ]);

  let html = "";

  if (health) {
    const stale = health.any_stale;
    html += `<div class="freshness ${stale ? 'stale' : ''}">
      ${stale ? '⚠️ 일부 데이터가 오래됨' : '✅ 데이터 최신 상태'} · 확인 ${timeAgo(health.timestamp)}
    </div>`;
  }

  if (risk) {
    html += `<div class="card">
      <p class="card-title">시장 위험도 <span>${timeAgo(risk.timestamp)}</span></p>
      <div class="risk-score">
        <span class="num">${risk.composite_score}</span>
        <span class="badge ${risk.level}">${risk.level}</span>
      </div>
    </div>`;
  }

  if (portfolio && portfolio.holdings_count > 0) {
    let itemsHtml = portfolio.items.map(it => `
      <div class="item-row">
        <div>
          <div class="item-name">${it.name}</div>
          <div class="item-reason">${it.quantity}주 · 평단 ${fmtNum(it.avg_price)}원</div>
        </div>
        <div style="text-align:right">
          <div class="${pnlClass(it.pnl_pct)}">${pnlSign(it.pnl_pct)}</div>
          <div class="item-reason">${fmtNum(it.eval_amount)}원</div>
        </div>
      </div>
    `).join("");

    html += `<div class="card">
      <p class="card-title">보유종목 손익 <span>${timeAgo(portfolio.timestamp)}</span></p>
      <div class="risk-score">
        <span class="num ${pnlClass(portfolio.total_pnl_pct)}">${pnlSign(portfolio.total_pnl_pct)}</span>
        <span style="color:var(--text-sub);font-size:13px">${fmtNum(portfolio.total_pnl_amount)}원</span>
      </div>
      ${itemsHtml}
    </div>`;
  } else {
    html += `<div class="card">
      <p class="card-title">보유종목 손익</p>
      <div class="empty">보유종목이 없습니다 (data/holdings.json에 입력)</div>
    </div>`;
  }

  if (discovery && discovery.top5) {
    let topHtml = discovery.top5.map(r => `
      <div class="item-row">
        <div>
          <div class="item-name">${r.name} ${"⭐".repeat(r.stars)}</div>
          <div class="item-reason">${r.reason}</div>
        </div>
        <span class="badge ${r.decision}">${r.decision}</span>
      </div>
    `).join("");

    html += `<div class="card">
      <p class="card-title">오늘의 발굴결과 TOP5 <span>${timeAgo(discovery.timestamp)}</span></p>
      ${topHtml}
    </div>`;
  }

  if (alerts && alerts.alerts && alerts.alerts.length > 0) {
    const sorted = [...alerts.alerts].sort((a, b) => {
      const order = { "긴급": 0, "경고": 1, "주의": 2, "정보": 3 };
      return (order[a.level] ?? 9) - (order[b.level] ?? 9);
    });
    let alertHtml = sorted.slice(0, 6).map(a => `
      <div class="item-row">
        <div class="item-name" style="font-weight:400;font-size:13px">${a.message}</div>
        <span class="badge ${a.level === '경고' ? '경고lv' : a.level}">${a.level}</span>
      </div>
    `).join("");

    html += `<div class="card">
      <p class="card-title">최근 리스크 경보 (${alerts.alert_count}건) <span>${timeAgo(alerts.timestamp)}</span></p>
      ${alertHtml}
    </div>`;
  }

  document.getElementById("main").innerHTML = html || `<div class="empty">데이터를 불러올 수 없습니다.</div>`;
}

loadDashboard();

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const rawData = atob(base64);
  const outputArray = new Uint8Array(rawData.length);
  for (let i = 0; i < rawData.length; ++i) outputArray[i] = rawData.charCodeAt(i);
  return outputArray;
}

const overlay = document.getElementById("subscribeOverlay");
document.getElementById("bellBtn").addEventListener("click", () => { overlay.style.display = "flex"; });
document.getElementById("closeOverlay").addEventListener("click", () => { overlay.style.display = "none"; });

document.getElementById("subscribeBtn").addEventListener("click", async () => {
  const statusEl = document.getElementById("subStatus");
  const jsonEl = document.getElementById("subJson");
  statusEl.textContent = "구독 진행 중...";
  try {
    if (!("serviceWorker" in navigator) || !("PushManager" in window)) {
      throw new Error("이 브라우저는 알림을 지원하지 않습니다.");
    }
    const permission = await Notification.requestPermission();
    if (permission !== "granted") throw new Error("알림 권한이 거부되었습니다.");

    const registration = await navigator.serviceWorker.register("sw.js");
    await navigator.serviceWorker.ready;
    const subscription = await registration.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });

    jsonEl.value = JSON.stringify(subscription.toJSON(), null, 2);
    jsonEl.style.display = "block";
    statusEl.textContent = "✅ 구독 완료! 아래 내용을 복사해서 data/push_subscription.json에 붙여넣으세요.";
  } catch (err) {
    statusEl.textContent = "❌ 오류: " + err.message;
  }
});

// ===== 채팅 로직 =====
const CHAT_WORKER_URL = "https://dc-jarvis-chat.kkandelo.workers.dev/";
let chatHistory = [];

const chatFab = document.getElementById("chatFab");
const chatOverlay = document.getElementById("chatOverlay");
const chatMessages = document.getElementById("chatMessages");
const chatInput = document.getElementById("chatInput");
const chatSendBtn = document.getElementById("chatSendBtn");

chatFab.addEventListener("click", () => {
  chatOverlay.classList.add("open");
  chatInput.focus();
});
document.getElementById("closeChatBtn").addEventListener("click", () => {
  chatOverlay.classList.remove("open");
});

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderMarkdownLite(text) {
  let safe = escapeHtml(text);
  safe = safe.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  safe = safe.replace(/^- (.+)$/gm, "• $1");
  return safe;
}

function addBubble(text, role, isError) {
  const row = document.createElement("div");
  row.className = "msg-row " + (role === "user" ? "user" : "bot");
  const bubble = document.createElement("div");
  bubble.className = "msg-bubble" + (isError ? " error" : "");
  if (role === "user") {
    bubble.textContent = text;
  } else {
    bubble.innerHTML = renderMarkdownLite(text);
  }
  row.appendChild(bubble);
  chatMessages.appendChild(row);
  chatMessages.scrollTop = chatMessages.scrollHeight;
  return bubble;
}

async function sendChatMessage(text) {
  if (!text.trim()) return;
  chatInput.value = "";
  chatInput.style.height = "auto";
  chatSendBtn.disabled = true;

  addBubble(text, "user");
  chatHistory.push({ role: "user", content: text });

  const loadingBubble = addBubble("생각 중...", "bot");

  try {
    const res = await fetch(CHAT_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: chatHistory }),
    });
    const data = await res.json();

    if (data.error) {
      loadingBubble.textContent = "오류가 발생했어요: " + data.error;
      loadingBubble.classList.add("error");
    } else {
      loadingBubble.innerHTML = renderMarkdownLite(data.reply);
      chatHistory.push({ role: "assistant", content: data.reply });
    }
  } catch (err) {
    loadingBubble.textContent = "연결에 실패했어요. 잠시 후 다시 시도해주세요.";
    loadingBubble.classList.add("error");
  } finally {
    chatSendBtn.disabled = false;
  }
}

chatSendBtn.addEventListener("click", () => sendChatMessage(chatInput.value));
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage(chatInput.value);
  }
});
chatInput.addEventListener("input", () => {
  chatInput.style.height = "auto";
  chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + "px";
});
document.querySelectorAll(".chip").forEach(chip => {
  chip.addEventListener("click", () => sendChatMessage(chip.dataset.q));
});
</script>
</body>
</html>
